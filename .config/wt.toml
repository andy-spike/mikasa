# Worktrunk project configuration — https://worktrunk.dev/config/
#
# The hooks below run when a worktree is created with `wt switch --create <branch>`.
# `pre-start` runs in the new worktree and blocks the switch until it finishes, so
# dependencies and environment variables are ready before anything else uses them.

[pre-start]
# Install dependencies into the new worktree. Each worktree gets its own
# node_modules, so a fresh checkout needs its own install before the app runs.
install = "pnpm install"

# Git worktrees share history but not gitignored files, so `.env.local` is absent
# from a new worktree. Copy it from the primary worktree (the original clone,
# where the untracked `.env.local` lives). Warn rather than fail when it is
# missing so a teammate without env setup can still create a worktree.
env = "if [ -f {{ primary_worktree_path }}/.env.local ]; then cp {{ primary_worktree_path }}/.env.local {{ worktree_path }}/.env.local; else echo 'worktrunk: no .env.local in the primary worktree — add one to this worktree before running the dev server' >&2; fi"
